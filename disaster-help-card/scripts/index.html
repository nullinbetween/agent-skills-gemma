<!DOCTYPE html>
<html lang="en">
<body>
<script>
  // Validates what the model returned and hands it to the action card.
  // Pre-written Japanese for actions/notes lives ONLY in assets/card.html.
  // Actions are re-sorted here by a fixed urgency order, so the top card never depends on model ordering.
  const ACTIONS = ['ambulance','fire','rescue','protect','first_aid','find_person','shelter','listen'];
  const NOTES = ['allergy','pregnant','mobility','no_japanese'];
  const ALLERGENS = ['egg','milk','wheat','shrimp','crab','buckwheat','peanut','walnut','soy','sesame','fish'];
  const INTERP = ['english','mandarin','cantonese','korean','vietnamese','nepali','tagalog','thai','indonesian','spanish','portuguese','french'];
  const MAX_ACTIONS = 3;

  const norm = (s) => String(s || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
  const toArr = (v) => Array.isArray(v) ? v : (v ? String(v).split(',') : []);
  const clip = (v, n) => String(v || '').replace(/\s+/g, ' ').trim().slice(0, n);

  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const x = typeof dataStr === 'string' ? JSON.parse(dataStr || '{}') : (dataStr || {});
      const rejected = [];
      const pick = (list, allowed) => {
        const out = [];
        for (const raw of toArr(list)) {
          const c = norm(raw);
          if (allowed.includes(c)) { if (!out.includes(c)) out.push(c); } else if (c) rejected.push(String(raw));
        }
        return out;
      };

      let actions = pick(x.actions, ACTIONS).sort((a, b) => ACTIONS.indexOf(a) - ACTIONS.indexOf(b));
      if (actions.length > 1) actions = actions.filter(a => a !== 'listen');   // listen is only the fallback
      if (!actions.length) actions = ['listen'];
      const dropped = actions.slice(MAX_ACTIONS);
      actions = actions.slice(0, MAX_ACTIONS);

      const notes = pick(x.notes, NOTES);
      let allergens = pick(x.allergens, ALLERGENS);
      if (allergens.length && !notes.includes('allergy')) notes.push('allergy');
      let interp = norm(x.interpreter);
      if (interp && !INTERP.includes(interp)) { rejected.push(String(x.interpreter)); interp = ''; }
      if (interp && !notes.includes('no_japanese')) notes.push('no_japanese');

      const yasashii = clip(x.yasashii, 300);
      const original = clip(x.original, 300);
      let ui = norm(x.ui_lang); if (!['zh','en','ja'].includes(ui)) ui = 'en';

      const q = new URLSearchParams({ a: actions.join(','), n: notes.join(','), al: allergens.join(','), i: interp, ui });
      if (yasashii) q.set('y', yasashii);
      if (original) q.set('o', original);

      let msg = `Card created. Actions: ${actions.join(', ')}` + (notes.length ? ` | notes: ${notes.join(', ')}` : '');
      if (dropped.length) msg += ` | not shown (max ${MAX_ACTIONS}): ${dropped.join(', ')}`;
      if (rejected.length) msg += ` | unknown codes ignored: ${rejected.join(', ')}`;
      if (!yasashii) msg += ' | no translation given';
      msg += '. Reply in one sentence: tap the card and show it to the people around you. No phone numbers.';
      return JSON.stringify({ result: msg, webview: { url: 'card.html?' + q.toString() } });
    } catch (e) {
      console.error(e);
      return JSON.stringify({ error: 'disaster-help-card error: ' + e.message });
    }
  };
</script>
</body>
</html>
