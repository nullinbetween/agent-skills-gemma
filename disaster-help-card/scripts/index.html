<!DOCTYPE html>
<html lang="en">
<body>
<script>
  // Validates the codes the model picked, then hands them to the card webview.
  // Japanese and translations live ONLY in assets/card.html (single source of truth).
  const NEEDS = ['emergency','injured','family_injured','sick','danger','medicine','allergy','no_pork','vegetarian',
    'water','food','with_child','formula','diapers','pregnant','mobility','lost_family','no_japanese',
    'shelter','toilet','charging','other'];
  const ALLERGENS = ['egg','milk','wheat','shrimp','crab','buckwheat','peanut','walnut','soy','sesame','fish'];
  const INTERP = ['english','mandarin','cantonese','korean','vietnamese','nepali','tagalog','thai',
    'indonesian','spanish','portuguese','french'];
  const UI = ['zh','en','ja'];

  const norm = (s) => String(s || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
  const toArr = (v) => Array.isArray(v) ? v : (v ? String(v).split(',') : []);

  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const input = typeof dataStr === 'string' ? JSON.parse(dataStr || '{}') : (dataStr || {});
      const rejected = [];
      const pick = (list, allowed) => {
        const out = [];
        for (const raw of toArr(list)) {
          const c = norm(raw);
          if (allowed.includes(c)) { if (!out.includes(c)) out.push(c); }
          else if (c) rejected.push(String(raw));
        }
        return out;
      };

      const needs = pick(input.needs, NEEDS);
      let allergens = pick(input.allergens, ALLERGENS);
      if (allergens.length && !needs.includes('allergy')) needs.push('allergy');
      if (!needs.includes('allergy')) allergens = [];

      let interpreter = norm(input.interpreter);
      if (interpreter && !INTERP.includes(interpreter)) { rejected.push(String(input.interpreter)); interpreter = ''; }
      if (interpreter && !needs.includes('no_japanese')) needs.push('no_japanese');

      // Anything the model could not map is shown back to the user, never silently dropped.
      const unmatched = toArr(input.unmatched).map(s => String(s).trim()).filter(Boolean).concat(rejected).slice(0, 6);
      if (unmatched.length && !needs.includes('other')) needs.push('other');

      let ui = norm(input.ui_lang);
      if (!UI.includes(ui)) ui = 'en';

      const q = new URLSearchParams({ n: needs.join(','), a: allergens.join(','), i: interpreter, ui });
      if (unmatched.length) q.set('u', JSON.stringify(unmatched).slice(0, 600));

      if (!needs.length) {
        return JSON.stringify({ error: 'No needs given. Do not make a card. Ask the user, in their own language, what help they need.' });
      }
      let msg = `Card created: ${needs.join(', ')}` + (allergens.length ? ` | allergens: ${allergens.join(', ')}` : '') + (interpreter ? ` | interpreter: ${interpreter}` : '');
      if (unmatched.length) msg += ` | shown to user as not on card: ${unmatched.join(' / ')}`;
      msg += '. Reply in one sentence: tap the card, check it, show it to people nearby. No phone numbers. No Japanese.';

      return JSON.stringify({ result: msg, webview: { url: 'card.html?' + q.toString() } });
    } catch (e) {
      console.error(e);
      return JSON.stringify({ error: 'disaster-help-card error: ' + e.message });
    }
  };
</script>
</body>
</html>
