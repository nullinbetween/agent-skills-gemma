<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たすけて ください</title>
<style>
  /* Design tokens and layout follow Digital Omamori Emergency mode (red head bar + white action card with red left rule). */
  :root { --ink:#3D4050; --ink-soft:#878BA1; --ink-faint:#B4B7C8; --line:rgba(150,156,186,.24);
    --lav:#D0CAE9; --lav-deep:#9189C0; --sky:#CBDAEE; --sky-deep:#7B99C0; --rose:#EAD6DB; --rose-deep:#BE96A0; --platinum:#C7CCDA;
    --red:#C0392B; --sans: Arial, "Hiragino Sans", "Noto Sans JP", "PingFang TC", sans-serif; --num: "Inter", Arial, "Helvetica Neue", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4EEF0; color: var(--ink); font-family: var(--sans); min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; }
  .head { background: var(--red); color: #fff; padding: 14px 18px; }
  .head .t { font-weight: 700; font-size: 19px; letter-spacing: 1px; line-height: 1.5; }
  .head .s { font-size: 12.5px; opacity: .9; margin-top: 2px; }
  .body { padding: 16px 14px 24px; max-width: 560px; margin: 0 auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: #5A5E72; background: #E8E2E4; padding: 5px 12px; border-radius: 20px; margin-bottom: 12px; }
  .card { background: #fff; border: 2px solid var(--rose-deep); border-left: 8px solid var(--red); border-radius: 14px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .lead { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #A33B4E; margin-bottom: 8px; }
  .lead span { letter-spacing: .5px; font-weight: 400; color: var(--ink-soft); margin-left: 6px; }
  .act { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
  .act + .act { border-top: 1px dashed var(--line); }
  .act .ico { flex: 0 0 auto; font-size: 22px; line-height: 1.3; }
  .act .txt { flex: 1; min-width: 0; }
  .act .ja { font-weight: 700; font-size: 19px; line-height: 1.5; color: #23252F; }
  .act.first .ja { font-size: 26px; }
  .act.first .ico { font-size: 30px; }
  .act .tr { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .x { flex: 0 0 auto; width: 26px; height: 26px; border: 0; background: transparent; color: var(--ink-faint); font-size: 15px; }
  .box { margin-top: 12px; padding: 10px 12px; border-radius: 10px; }
  .box .bl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 4px; }
  .notes { background: #F3F0F7; border: 1px solid var(--platinum); }
  .notes .bl { color: #7C7FA0; }
  .note { font-size: 16px; font-weight: 700; line-height: 1.5; padding: 3px 0; }
  .note .tr { display: block; font-size: 12.5px; font-weight: 400; color: var(--ink-soft); }
  .note b { background: var(--rose); color: #8a4a58; border-radius: 6px; padding: 0 6px; }
  .why { background: rgba(203,218,238,.3); border: 1.5px dashed var(--sky-deep); }
  .why .bl { color: var(--sky-deep); }
  .why .bl span { display: block; font-weight: 400; letter-spacing: .3px; color: var(--ink-soft); font-size: 11px; }
  .why .yj { font-size: 18px; font-weight: 700; line-height: 1.6; margin-top: 4px; }
  .why .aitr { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .why .orig { font-size: 13.5px; background: #fff; border-radius: 8px; padding: 6px 9px; margin-top: 6px; }
  .why .orig b { color: var(--ink-soft); font-weight: 600; margin-right: 6px; }
  .ja, .yj, .note { word-break: keep-all; overflow-wrap: anywhere; }  /* 分かち書き: break lines only at the spaces */
  ruby { ruby-align: center; }
  rt { font-size: .5em; font-weight: 500; color: var(--ink-soft); }
  .head rt { color: rgba(255,255,255,.85); }
  .row { display: flex; justify-content: center; margin-top: 14px; }
  .btn { padding: 10px 22px; font-size: 13px; font-weight: 600; border-radius: 999px; border: 0; background: var(--lav); color: #4A4470; }
  .foot { font-size: 11px; color: var(--ink-faint); line-height: 1.6; text-align: center; margin-top: 14px; }
  .big .act .ja { font-size: 24px; } .big .act.first .ja { font-size: 32px; } .big .why .yj { font-size: 24px; } .big .note { font-size: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // ── Pre-written text. Japanese = やさしい日本語 in Omamori notation 漢字（かな）; proofread by a human. ──
  const HEAD = { ja: 'すみません。たすけて ください。', zh: '不好意思，請幫幫我。', en: 'Excuse me, please help me.' };
  // action: [icon, Japanese, 中文, English]
  const A = {
    ambulance:   ['🚑','救急車（きゅうきゅうしゃ）を 呼（よ）んで ください。','請叫救護車。','Please call an ambulance.'],
    fire:        ['🔥','火事（かじ）です。','發生火災了。','There is a fire.'],
    rescue:      ['🏚️','中（なか）に 人（ひと）が います。たすけて ください。','裡面有人，請救救他們。','Someone is inside. Please help them.'],
    protect:     ['🆘','知（し）らない 人（ひと）が ついて きます。そばに いて ください。','有陌生人跟著我，請留在我身邊。','A stranger is following me. Please stay with me.'],
    first_aid:   ['🩹','けがを して います。手当（てあ）てを して ください。','有人受傷了，請幫忙處理傷口。','Someone is injured. Please give first aid.'],
    find_person: ['🔎','人（ひと）を 探（さが）して います。','我在找人。','I am looking for someone.'],
    shelter:     ['🏫','避難所（ひなんじょ）に つれて 行（い）って ください。','請帶我去避難所。','Please take me to an evacuation shelter.'],
    listen:      ['💬','たすけて ください。話（はなし）を 聞（き）いて ください。','請幫幫我，請聽我說。','Please help me. Please listen to me.'],
  };
  const ORDER = Object.keys(A);
  // note: [Japanese, 中文, English]
  const N = {
    allergy:     ['食（た）べものの アレルギーが あります。','我有食物過敏。','I have a food allergy.'],
    pregnant:    ['おなかに 赤（あか）ちゃんが います。','我懷孕了。','I am pregnant.'],
    mobility:    ['ひとりで 歩（ある）けません。','沒辦法自己走路。','Cannot walk alone.'],
    no_japanese: ['日本語（にほんご）が あまり わかりません。やさしい 日本語（にほんご）で ゆっくり 話（はな）して ください。','我不太懂日文，請用簡單的日文慢慢說。','I do not understand much Japanese. Please speak slowly in simple Japanese.'],
  };
  const ALG = { egg:['卵（たまご）','蛋','egg'], milk:['牛乳（ぎゅうにゅう）・乳製品（にゅうせいひん）','牛奶／乳製品','milk / dairy'], wheat:['小麦（こむぎ）','小麥','wheat'],
    shrimp:['えび','蝦','shrimp'], crab:['かに','蟹','crab'], buckwheat:['そば','蕎麥','buckwheat'], peanut:['落花生（らっかせい）（ピーナッツ）','花生','peanut'],
    walnut:['くるみ','核桃','walnut'], soy:['大豆（だいず）','大豆','soy'], sesame:['ごま','芝麻','sesame'], fish:['魚（さかな）','魚','fish'] };
  const LANG = { english:['英語（えいご）','英文','English'], mandarin:['中国語（ちゅうごくご）','普通話','Mandarin'], cantonese:['広東語（かんとんご）','廣東話','Cantonese'],
    korean:['韓国語（かんこくご）','韓文','Korean'], vietnamese:['ベトナム語（ご）','越南語','Vietnamese'], nepali:['ネパール語（ご）','尼泊爾語','Nepali'],
    tagalog:['タガログ語（ご）','他加祿語','Tagalog'], thai:['タイ語（ご）','泰文','Thai'], indonesian:['インドネシア語（ご）','印尼文','Indonesian'],
    spanish:['スペイン語（ご）','西班牙文','Spanish'], portuguese:['ポルトガル語（ご）','葡萄牙文','Portuguese'], french:['フランス語（ご）','法文','French'] };
  const T = {
    zh: { lead:'先做這件事', notes:'請注意', why:'發生了什麼事', ai:'AI 翻譯（可能有錯，請對照下面的原文）', orig:'原文', chip:'手機內離線製作' },
    en: { lead:'Do this first', notes:'Please note', why:'What happened', ai:'AI translation (may contain mistakes; check against the original below)', orig:'Original', chip:'Made on this phone, offline' },
    ja: { lead:'', notes:'', why:'', ai:'', orig:'原文', chip:'' },
  };

  const qs = new URLSearchParams(location.search);
  const list = (k) => (qs.get(k) || '').split(',').filter(Boolean);
  const S = {
    actions: list('a').filter(k => A[k]).sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b)).slice(0, 3),
    notes: list('n').filter(k => N[k]),
    allergens: list('al').filter(k => ALG[k]),
    interp: LANG[qs.get('i')] ? qs.get('i') : '',
    yasashii: qs.get('y') || '', original: qs.get('o') || '',
    ui: ['zh','en','ja'].includes(qs.get('ui')) ? qs.get('ui') : 'en',
    big: false,
  };
  if (!S.actions.length) S.actions = ['listen'];
  const t = T[S.ui];
  const I = S.ui === 'zh' ? 1 : 2;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const ruby = (html) => html.replace(/([々〆一-龯]+)（([ぁ-ゖー]+)）/g, '<ruby>$1<rt>$2</rt></ruby>');
  const tr = (arr, idx) => S.ui === 'ja' ? '' : arr[idx];

  function render() {
    let h = `<div class="head"><div class="t">⚠ ${HEAD.ja}</div>${S.ui !== 'ja' ? `<div class="s">${HEAD[S.ui]}</div>` : ''}</div><div class="body">`;
    h += `<div class="chip">● 端末内（たんまつない）・オフライン${t.chip ? ' · ' + t.chip : ''}</div>`;
    h += `<div class="card"><div class="lead">まず これを して ください${t.lead ? `<span>${t.lead}</span>` : ''}</div>`;
    S.actions.forEach((k, i) => {
      const r = A[k];
      h += `<div class="act ${i === 0 ? 'first' : ''}"><div class="ico">${r[0]}</div><div class="txt"><div class="ja">${r[1]}</div>` +
        `${tr(r, S.ui === 'zh' ? 2 : 3) ? `<div class="tr">${tr(r, S.ui === 'zh' ? 2 : 3)}</div>` : ''}</div>` +
        (S.actions.length > 1 ? `<button class="x" data-act="del" data-k="${k}" aria-label="remove">×</button>` : '') + `</div>`;
    });
    if (S.notes.length) {
      h += `<div class="box notes"><div class="bl">気（き）を つけて ください${t.notes ? ' · ' + t.notes : ''}</div>`;
      for (const k of S.notes) {
        let ja = N[k][0], x = tr(N[k], I);
        if (k === 'allergy' && S.allergens.length) {
          ja += ` <b>${S.allergens.map(a => ALG[a][0]).join('、')}</b>`;
          if (x) x += ' ' + S.allergens.map(a => ALG[a][I]).join(S.ui === 'zh' ? '、' : ', ');
        }
        if (k === 'no_japanese' && S.interp) {
          ja += ` <b>${LANG[S.interp][0]}</b>が 話（はな）せる 人（ひと）は いますか。`;
          if (x) x += S.ui === 'zh' ? ` 有會說${LANG[S.interp][1]}的人嗎？` : ` Is there anyone who speaks ${LANG[S.interp][2]}?`;
        }
        h += `<div class="note">${ja}${x ? `<span class="tr">${x}</span>` : ''}</div>`;
      }
      h += `</div>`;
    }
    if (S.yasashii) {
      h += `<div class="box why"><div class="bl">なにが あったか${t.why ? ' · ' + t.why : ''}<span>AIの 翻訳（ほんやく）です。まちがいが あるかも しれません。</span></div>` +
        `<div class="yj">${esc(S.yasashii)}</div>` + (t.ai ? `<div class="aitr">${t.ai}</div>` : '') +
        (S.original ? `<div class="orig"><b>${t.orig}</b>${esc(S.original)}</div>` : '') + `</div>`;
    }
    h += `</div><div class="row"><button class="btn" data-act="big" aria-label="bigger text">A ＋</button></div>`;
    h += `<div class="foot">「まず これを して ください」と「気を つけて ください」は 事前（じぜん）に 確認（かくにん）した 定型文（ていけいぶん）です。<br>「なにが あったか」だけが AIの 翻訳です。<br>Actions and notes are pre-written Japanese. Only "What happened" is an AI translation.<br>對照語言 Check language：繁體中文 / English</div></div>`;
    document.body.classList.toggle('big', S.big);
    document.getElementById('root').innerHTML = ruby(h);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    if (b.dataset.act === 'del') { S.actions = S.actions.filter(a => a !== b.dataset.k); if (!S.actions.length) S.actions = ['listen']; }
    if (b.dataset.act === 'big') S.big = !S.big;
    render();
  });
  render();
</script>
</body>
</html>
